services:
  - type: web
    name: bookleaf-author-portal
    env: node
    plan: free
    buildCommand: "npm run install:all && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
