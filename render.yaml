services:
  - type: web
    name: bookleaf-author-portal
    env: node
    plan: free
    buildCommand: "npm run install:all && cd client && npm run build && cp -r dist ../server/public"
    startCommand: "cd server && npm run start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
