openapi: 3.0.3
info:
  title: BookLeaf Author Support & Communication Portal API
  description: >
    RESTful API powering BookLeaf Publishing's author support workflows,
    featuring AI auto-classification, priority scoring, automated drafting,
    role-based access control, and real-time Server-Sent Events.
  version: 1.0.0
  contact:
    name: BookLeaf Technical Team
    email: support@bookleaf.in

servers:
  - url: http://localhost:5000
    description: Local Development Server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          example: priya.sharma@email.com
        password:
          type: string
          example: author123

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          type: object
          properties:
            id:
              type: string
            email:
              type: string
            name:
              type: string
            role:
              type: string
              enum: [author, admin]
            author_id:
              type: string

    TicketCreateRequest:
      type: object
      required:
        - subject
        - description
      properties:
        book_id:
          type: string
          nullable: true
          example: BK001
        subject:
          type: string
          example: Haven't received royalty payout for over 4 months
        description:
          type: string
          example: Published in June, sales are high, but royalty shows unpaid.
        attachment_url:
          type: string
          nullable: true

    TicketPatchRequest:
      type: object
      properties:
        status:
          type: string
          enum: [Open, In Progress, Resolved, Closed]
        category:
          type: string
          enum:
            - Royalty & Payments
            - ISBN & Metadata Issues
            - Printing & Quality
            - Distribution & Availability
            - Book Status & Production Updates
            - General Inquiry
        priority:
          type: string
          enum: [Critical, High, Medium, Low]
        assigned_to:
          type: string

    MessageCreateRequest:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: We have verified your account and dispatched the payment batch.
        attachment_url:
          type: string

    InternalNoteRequest:
      type: object
      required:
        - note
      properties:
        note:
          type: string
          example: Bank IFSC code was missing a leading zero, re-queued.

paths:
  /api/auth/login:
    post:
      summary: User Login (Author or Admin)
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        200:
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        401:
          description: Invalid credentials

  /api/auth/me:
    get:
      summary: Current Authenticated User & Profile
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Current user information

  /api/auth/demo-users:
    get:
      summary: List seeded sample accounts for 1-click evaluation
      tags: [Authentication]
      responses:
        200:
          description: List of demo authors and admins

  /api/auth/seed:
    post:
      summary: Reset and seed database with 10 authors, 18 books, and tickets
      tags: [Authentication]
      responses:
        200:
          description: Database successfully seeded

  /api/authors:
    get:
      summary: List all authors with KPI metrics (Admin only)
      tags: [Authors]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Array of authors

  /api/authors/{id}/books:
    get:
      summary: List books for a specific author
      tags: [Authors]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: List of books with sales and royalty stats

  /api/authors/{id}/metrics:
    get:
      summary: Aggregate KPI figures (earned, paid, pending) for author
      tags: [Authors]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: KPI statistics

  /api/tickets:
    get:
      summary: List tickets (role filtered, with search & sort)
      tags: [Tickets]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: priority
          in: query
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [urgent_first, newest, oldest]
      responses:
        200:
          description: List of tickets
    post:
      summary: Create new support ticket (Triggers AI classification & scoring)
      tags: [Tickets]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreateRequest'
      responses:
        201:
          description: Ticket created successfully

  /api/tickets/events:
    get:
      summary: Real-time Server-Sent Events stream for ticket synchronization
      tags: [Real-Time]
      security:
        - bearerAuth: []
      responses:
        200:
          description: SSE connection established (text/event-stream)

  /api/tickets/{id}:
    get:
      summary: Get ticket detail and full conversation thread
      tags: [Tickets]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Ticket record
    patch:
      summary: Admin update ticket (status, override category/priority, assign)
      tags: [Tickets]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketPatchRequest'
      responses:
        200:
          description: Updated ticket

  /api/tickets/{id}/messages:
    post:
      summary: Reply to ticket (Author or Admin)
      tags: [Tickets]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageCreateRequest'
      responses:
        201:
          description: Message appended

  /api/tickets/{id}/notes:
    post:
      summary: Add private internal note (Admin only, hidden from author)
      tags: [Tickets]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalNoteRequest'
      responses:
        201:
          description: Note added

  /api/tickets/{id}/ai-draft:
    post:
      summary: Generate / Regenerate AI response draft using BookLeaf KB
      tags: [AI Integration]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: AI generated draft response
